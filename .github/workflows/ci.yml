name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            test: true
          - os: macos-14
            target: x86_64-apple-darwin
            test: false
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            test: true
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            test: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: npm ci
      - run: npm run build -- --target ${{ matrix.target }}
      - name: Test
        if: matrix.test
        run: npm test
      - name: Rust unit tests
        if: matrix.test
        run: cargo test --release
      - uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: fs-extra.*.node
          if-no-files-found: error

  publish:
    name: publish to npm
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Check that the tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME}"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Move the binaries into npm/<platform>
        run: npx napi artifacts
      - name: Publish the platform packages and @jscpd/fs-extra
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
