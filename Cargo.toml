[package]
name = "jscpd-fs-extra"
version = "0.1.0"
edition = "2021"
description = "Native core of @jscpd/fs-extra: the fs-extra API as a Node.js addon (napi-rs)"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi6", "async"] }
napi-derive = "2"
libc = "0.2"
rayon = "1.10"
unicode-normalization = "0.1.25"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
